name: CI y staging
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  qualification:
    name: QA PHP ${{ matrix.php }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        php: ['8.2.35', '8.4.27']
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring, openssl, fileinfo, pdo_sqlite
          ini-values: date.timezone=America/Costa_Rica, expose_php=Off
          coverage: none
          tools: none
      - name: Instalar dependencias Python con hashes
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r qa/requirements.txt
      - name: Instalar dependencias Node del lockfile
        working-directory: qa
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Instalar el Chromium fijado por Playwright
        run: node qa/node_modules/playwright/cli.js install --with-deps chromium
      - name: Sintaxis, regresiones y navegador con datos ficticios
        run: python -B tools/qa.py --php php --suite all --output "${{ runner.temp }}/qualification-${{ matrix.php }}"
      - name: Conservar informe y logs de QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-${{ matrix.os }}-php-${{ matrix.php }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/qualification-${{ matrix.php }}/*.json
            ${{ runner.temp }}/qualification-${{ matrix.php }}/*.log
            ${{ runner.temp }}/qualification-${{ matrix.php }}/fixture/app/outputs/
          retention-days: 14

  build:
    name: Paquete de codigo verificado
    needs: [qualification]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.12'
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.4.27'
          extensions: curl, mbstring, openssl, fileinfo, pdo_sqlite
          ini-values: date.timezone=America/Costa_Rica, expose_php=Off
          coverage: none
          tools: none
      - name: Construir paquete desde blobs del SHA, sin datos ni dependencias instaladas
        run: python tools/ci_release.py build --output "${{ runner.temp }}/release"
      - uses: actions/upload-artifact@v4
        with:
          name: code-${{ github.sha }}
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 14

  staging:
    name: Validar el mismo artefacto con PHP 8.4
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.12'
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.4.27'
          extensions: curl, mbstring, openssl, fileinfo, pdo_sqlite
          ini-values: date.timezone=America/Costa_Rica, expose_php=Off
          coverage: none
          tools: none
      - uses: actions/download-artifact@v4
        with:
          name: code-${{ github.sha }}
          path: ${{ runner.temp }}/release/
      - name: Smoke HTTP con datos ficticios, sin reconstruir el paquete
        run: python tools/ci_release.py smoke --package "${{ runner.temp }}/release" --php php
