<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Altoidss | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/login.css?v=4">
    <link rel="stylesheet" href="../css/site-shared.css?v=8">
</head>
<body class="layout-no-sidebar">
    <!-- Encabezado con acceso rápido a la página de inicio. -->
    <header class="topbar navbar navbar-dark navbar-expand-xl">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="index.html"><span class="brand-mark">AL</span>Altoidss</a>
            <button class="navbar-toggler nav-toggle" type="button" data-bs-toggle="collapse" data-bs-target="#site-navigation" aria-controls="site-navigation" aria-expanded="false" aria-label="Abrir menú de navegación">
                <span class="navbar-toggler-icon"></span>
            </button>
            <nav class="top-nav collapse navbar-collapse" id="site-navigation" aria-label="Navegación del sitio">
                <a href="index.html">Inicio</a>
                <a href="catalogo.html">Catálogo</a>
                <a href="catalogo.html?category=movies">Películas</a>
                <a href="catalogo.html?category=series">Series</a>
                <a href="catalogo.html?category=anime">Anime</a>
                <a href="noticias.html">Noticias</a>
                <a href="favoritos.html">Mi lista</a>
                <a href="dashboard.html">Dashboard</a>
            </nav>
            <a class="search-icon" href="catalogo.html" aria-label="Buscar contenido" title="Buscar contenido">
                <svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" fill="currentColor" class="bi bi-search" viewBox="0 0 16 16" aria-hidden="true">
                    <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/>
                </svg>
            </a>
            <a class="login-icon is-active" href="login.html" aria-label="Iniciar sesión" title="Iniciar sesión">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-person" viewBox="0 0 16 16" aria-hidden="true">
                    <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6m2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0m4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4m-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10s-3.516.68-4.168 1.332c-.678.678-.83 1.418-.832 1.664z"/>
                </svg>
            </a>
        </div>
    </header>

    <div class="app-shell">

        <!-- Contenido principal: formularios de acceso y registro con cambio animado. -->
        <main class="content login-content">
            <section class="auth-card" id="authCard">
                <div class="auth-slider">
                    <div class="auth-track">
                        <form class="auth-form" id="loginForm" aria-label="Formulario de inicio de sesión">
                            <p class="eyebrow">Acceso</p>
                            <h1>Inicio de sesión</h1>
                            <p class="form-note">Ingrese sus datos para acceder a su perfil y favoritos.</p>

                            <div class="mb-3">
                                <label class="form-label" for="login-email">Correo electrónico</label>
                                <input class="form-control" id="login-email" type="email" placeholder="usuario@altoidss.com" autocomplete="email" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="login-password">Contraseña</label>
                                <input class="form-control" id="login-password" type="password" placeholder="Ingrese su contraseña" autocomplete="current-password" required>
                            </div>
                            <button class="btn btn-primary w-100" type="submit">Ingresar</button>

                            <div class="auth-feedback" id="loginFeedback" role="status"></div>

                            <!-- Botones preparados para autenticación social futura. No son funcionales hasta integrar backend y base de datos. -->
                            <div class="social-login" aria-label="Opciones de acceso social no funcionales">
                                <button class="social-login-button" type="button" data-provider="google" disabled>
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-google" viewBox="0 0 16 16" aria-hidden="true">
                                        <path d="M15.545 6.558a9.4 9.4 0 0 1 .139 1.626c0 2.434-.87 4.492-2.384 5.885h.002C11.978 15.292 10.158 16 8 16A8 8 0 1 1 8 0a7.7 7.7 0 0 1 5.352 2.082l-2.284 2.284A4.35 4.35 0 0 0 8 3.166c-2.087 0-3.86 1.408-4.492 3.304a4.8 4.8 0 0 0 0 3.063h.003c.635 1.893 2.405 3.301 4.492 3.301 1.078 0 2.004-.276 2.722-.764h-.003a3.7 3.7 0 0 0 1.599-2.431H8v-3.08z"/>
                                    </svg>
                                    Google
                                </button>
                                <button class="social-login-button" type="button" data-provider="github" disabled>
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-github" viewBox="0 0 16 16" aria-hidden="true">
                                        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82A7.6 7.6 0 0 1 8 3.89c.68.003 1.36.092 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8"/>
                                    </svg>
                                    GitHub
                                </button>
                            </div>
                        </form>

                        <form class="auth-form" id="registerForm" aria-label="Formulario de registro">
                            <p class="eyebrow">Nuevo usuario</p>
                            <h1>Registro</h1>
                            <p class="form-note">Cree una cuenta para guardar favoritos y comentar contenido.</p>

                            <div class="mb-3">
                                <label class="form-label" for="register-name">Nombre completo</label>
                                <input class="form-control" id="register-name" type="text" placeholder="Nombre y apellidos" autocomplete="name" minlength="2" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="register-email">Correo electrónico</label>
                                <input class="form-control" id="register-email" type="email" placeholder="usuario@correo.com" autocomplete="email" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="register-password">Contraseña</label>
                                <input class="form-control" id="register-password" type="password" placeholder="Crear contraseña" autocomplete="new-password" minlength="8" required>
                            </div>
                            <button class="btn btn-primary w-100" type="submit">Crear cuenta</button>
                            <div class="auth-feedback" id="registerFeedback" role="status"></div>
                        </form>
                    </div>
                </div>

                <div class="auth-switch" aria-label="Cambiar tipo de formulario">
                    <button class="auth-switch-button is-active" type="button" data-auth-view="login">Login</button>
                    <button class="auth-switch-button" type="button" data-auth-view="register">Registro</button>
                </div>
            </section>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="../js/site-search.js?v=3"></script>
    <script src="../js/api-client.js?v=1"></script>
    <script src="../js/auth.js?v=5"></script>
    <script src="../js/site-account.js?v=1"></script>
    <script src="../js/login.js?v=4"></script>
</body>
</html>
